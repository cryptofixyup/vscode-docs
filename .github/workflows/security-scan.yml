name: Documentation Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - '.gitleaks-docs.toml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - '.gitleaks-docs.toml'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  gitleaks-docs:
    name: Gitleaks for Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .validation-policy
          sparse-checkout: .gitleaks-docs.toml
          sparse-checkout-cone-mode: false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .validation-policy/.gitleaks-docs.toml

  markdown-link-check:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .validation-policy
          sparse-checkout: .markdown-link-check.json
          sparse-checkout-cone-mode: false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.11.2

      - name: Check Markdown Links
        run: |
          set -o pipefail
          find . -path './.validation-policy' -prune -o -name "*.md" -type f -print0 | xargs -0 -r markdown-link-check \
            --config .validation-policy/.markdown-link-check.json \
            --quiet

  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .validation-policy
          sparse-checkout: .yamllint.yml
          sparse-checkout-cone-mode: false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install yamllint==1.33.0

      - name: Validate YAML Files
        run: |
          yamllint \
            .github/workflows \
            --config-file .validation-policy/.yamllint.yml \
            --format parsable \
            --strict

  json-validate:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate JSON Files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              ./.devcontainer/devcontainer.json|./.vscode/settings.json|./.vscode/extensions/doc-assistant/.vscode/settings.json|./.vscode/extensions/doc-assistant/.vscode/launch.json|./.vscode/extensions/doc-assistant/.vscode/tasks.json|./.vscode/extensions/doc-assistant/tsconfig.json|./api/toc.json)
                continue
                ;;
            esac
            echo "Validating $file"
            jq empty "$file"
          done < <(find . -name "*.json" -type f -print0)

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: .
          extra_args: --only-verified
