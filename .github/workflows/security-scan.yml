name: Documentation Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  gitleaks-docs:
    name: Gitleaks for Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks-docs.toml
          log-level: debug

  markdown-link-check:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.11.2

      - name: Check Markdown Links
        run: |
          find . -name "*.md" -type f | xargs markdown-link-check \
            --config .markdown-link-check.json \
            --quiet || true

  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.33.0

      - name: Validate YAML Files
        run: |
          yamllint . \
            --config-file .yamllint.yml \
            --format parsable \
            --strict || true

  json-validate:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate JSON Files
        run: |
          find . -name "*.json" -type f | while read file; do
            echo "Validating $file"
            jq empty "$file" || echo "Invalid JSON: $file"
          done || true

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: main
          head: HEAD
          filter: files
          only-verified: true
          fail: false
