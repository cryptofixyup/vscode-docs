name: Documentation Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '**.json'
      - '**.yml'
      - '**.yaml'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  gitleaks-docs:
    name: Gitleaks for Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks-docs.toml

  markdown-link-check:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.11.2

      - name: Check Markdown Links
        run: |
          set -o pipefail
          find . -name "*.md" -type f -print0 | xargs -0 -r markdown-link-check \
            --config .markdown-link-check.json \
            --quiet

  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint==1.33.0

      - name: Validate YAML Files
        run: |
          yamllint \
            .github/workflows \
            --config-file .yamllint.yml \
            --format parsable \
            --strict

  json-validate:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate JSON Files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              ./.devcontainer/devcontainer.json|./.vscode/settings.json|./.vscode/extensions/doc-assistant/.vscode/settings.json|./.vscode/extensions/doc-assistant/.vscode/launch.json|./.vscode/extensions/doc-assistant/.vscode/tasks.json|./.vscode/extensions/doc-assistant/tsconfig.json|./api/toc.json)
                continue
                ;;
            esac
            echo "Validating $file"
            jq empty "$file"
          done < <(find . -name "*.json" -type f -print0)

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified
