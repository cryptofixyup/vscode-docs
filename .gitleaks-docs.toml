[extend]
useDefault = true

[allowlist]
description = "Known inherited documentation and generated keybinding false positives"

paths = [
  '''^build/keybindings/doc\.keybindings\..*\.json$''',
  '''^release-notes/.*\.md$'''
]

regexes = [
  '''https?://example\.com''',
  '''https?://[a-z]+\.placeholder\.com''',
  '''test_token|sample_key|example_secret'''
]
