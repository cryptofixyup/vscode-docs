extends: default

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  indentation:
    spaces: 2
    indent-sequences: consistent

  quotes:
    required: false
    extra-allowed: ["'", '"']

  trailing-spaces: enable

  document-start: disable
  document-end: disable

  truthy:
    allowed-values: [true, false, yes, no, on, off]

  empty-values: disable

  # Relax some rules for documentation files
  commas:
    max-spaces-before: 1
    max-spaces-after: 1

  brackets:
    max-spaces-inside: 1
    max-spaces-inside-empty: -1

  colons:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
